# L3 (Executioner) RecurrentPPO config -- architecture_spec.md Section 4.1.
# Values below are Section 4.1's exact hyperparameters where specified. Anything
# Section 4.1 does not specify is marked "JUDGMENT CALL" with the reasoning, per
# the Phase 3 task's explicit instruction not to silently pick.

ppo_l3:
  policy: MlpLstmPolicy
  total_timesteps: 20_000_000       # Section 4.1's real target for the eventual full run.
                                     # NOT used by the Phase 3 first-pass smoke test, which
                                     # overrides this via --total-timesteps on the CLI --
                                     # this field documents the production value, unchanged.
  learning_rate: 0.0003             # 3e-4, Section 4.1
  gamma: 0.995                      # Section 4.1: ~100ms ticks -> ~5s effective discount horizon
  gae_lambda: 0.95                  # Section 4.1
  n_steps: 512                      # Section 4.1: ticks per env per rollout
  batch_size: 256                   # Section 4.1
  n_epochs: 6                       # Section 4.1
  clip_range: 0.15                  # Section 4.1
  ent_coef: 0.005                   # Section 4.1: small -- action space already fairly constrained
  vf_coef: 0.5                      # JUDGMENT CALL: not specified in Section 4.1's reference
                                     # RecurrentPPO(...) call. Using sb3-contrib's own default
                                     # (confirmed via RecurrentPPO.__init__ signature) rather
                                     # than inventing a different number.
  max_grad_norm: 0.5                # JUDGMENT CALL: same as vf_coef -- not in Section 4.1,
                                     # sb3-contrib's own default used as-is.
  policy_kwargs:
    lstm_hidden_size: 128           # Section 4.1
    n_lstm_layers: 1                # Section 4.1
    net_arch:
      pi: [128]                     # Section 4.1
      vf: [128]                     # Section 4.1
  n_envs: 8                         # Section 4.1's N_ENVS (a script-level constant there,
                                     # promoted to config here since it is a real training
                                     # hyperparameter, not incidental script plumbing)
  seed: 42                          # JUDGMENT CALL: Section 4.1's reference code seeds each
                                     # env individually (LOBExecutionEnv(..., seed=rank)), which
                                     # does not match the real env's constructor (see Step 0
                                     # reconciliation -- LOBExecutionEnv has no seed param; the
                                     # seed lives on reset()). The correct real mechanism is
                                     # passing seed= to RecurrentPPO itself: SB3's
                                     # BaseAlgorithm.set_random_seed() calls env.seed(seed) on
                                     # the VecEnv, and SubprocVecEnv.seed() distributes seed+idx
                                     # to each worker automatically on its next reset() --
                                     # confirmed directly against the installed SB3 2.3.2 source,
                                     # not assumed. 42 is an arbitrary, documented default,
                                     # overridable via CLI.
  device: cuda                      # Section 4.1
  verbose: 1                        # Section 4.1
  tensorboard_log: logs/l3_ppo/     # Section 4.1

# Not in Section 4.1 at all -- these govern the held-out val evaluation and checkpointing
# this task explicitly requires building (Section 4.1's reference code has no eval loop and
# only a single final model.save(), no periodic checkpoints).
eval:
  eval_freq_timesteps: 250_000      # REBALANCED for the real 20M-step run (smoke test used
                                     # 4096, which would fire ~4,883 times over the full run --
                                     # both wasteful and, at n=5, too thin to mean anything).
                                     # 20_000_000 / 250_000 = 80 eval points across the run,
                                     # inside the 40-100 range that gives a real learning curve
                                     # without excess firings.
                                     # Overhead check, measured directly rather than guessed:
                                     # timed 30 real eval episodes against the smoke-test
                                     # checkpoint on the actual training GPU -- 2.27s/episode
                                     # mean (dominated by env.reset()'s per-day data load and
                                     # feature precompute, not by per-tick inference). Pure
                                     # training throughput backed out from the smoke test log
                                     # (iteration-2 wall time minus its 5-episode eval cost):
                                     # ~17.4 steps/s, so the 20M-step run costs roughly 319
                                     # training-only hours on its own. 80 firings * 50 episodes
                                     # * 2.27s is about 3.0 hours of eval total -- 0.79% of that,
                                     # negligible. n_eval_episodes below is therefore chosen for
                                     # statistical power, not to protect this budget.
                                     # The short smoke test does not use this value directly --
                                     # it overrides via --eval-freq so a short run still fires
                                     # eval multiple times and exercises the cadence and pairing
                                     # logic before real GPU time is committed.
  n_eval_episodes: 50                # REBALANCED (was 5). Phase 2a measured this exact metric
                                     # at std roughly 5-9bps/episode (unpaired, n=50). At the
                                     # old n=5, the unpaired standard error on the L3-vs-TWAP
                                     # difference was about 3.2-5.7bps -- far larger than the
                                     # approximately 0.1-0.15bps gap the smoke test reported, so
                                     # that comparison carried no real statistical power.
                                     # Now paired (see ValISEvalCallback docstring: same fixed
                                     # seed set drives both arms at every eval point), so some
                                     # of that per-episode noise should cancel across arms; even
                                     # ignoring that benefit entirely, n=50 alone drops standard
                                     # error to roughly 0.7-1.3bps -- small enough to detect a
                                     # real several-bps learning signal once one exists, for well
                                     # under 1% added wall-clock overhead (see eval_freq above).
checkpoint:
  save_freq_timesteps: 4096         # JUDGMENT CALL: same reasoning as the original eval_freq --
                                     # roughly once per rollout (n_envs * n_steps = 8*512).
                                     # Left unchanged: checkpoint cost is a cheap disk write, not
                                     # a full eval episode, so it does not carry the same
                                     # overhead pressure that motivated rebalancing eval_freq.
  save_vecnormalize: true           # Section 4.1's note: VecNormalize stats must be saved
                                     # alongside the model for eval to use matching normalization.

# Inherited from LOBExecutionEnv's own existing defaults (Section 3), not freshly decided
# here -- Section 4.1's reference code does not pass these either.
env:
  horizon_ticks: 3000
  lookback_ticks: 10
