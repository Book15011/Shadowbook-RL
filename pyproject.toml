[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-execution-hma"
version = "0.1.0"
description = "Pre-flight bootstrap for hierarchical multi-agent LOB execution"
requires-python = ">=3.11"
dependencies = [
  "gymnasium==0.29.1",
  "stable-baselines3==2.3.2",
  "sb3-contrib==2.3.0",
  "langgraph==0.2.34",
  "pydantic>=2",
  "pandas==2.2.2",
  "pyarrow==17.0.0",
  "requests==2.32.3",
  "websockets==12.0",
  "pytest==8.3.2",
  "tensorboard==2.21.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "rich>=13"
]
